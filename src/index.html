<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Öğretmen AI - Blok Kodlama</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f7fb;
    display: flex;
    height: 100vh;
  }
  #blocklyArea {
    flex: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #dbe3ee;
  }
  #blocklyDiv {
    /* Tüm blokların rahatça görünebilmesi için bu alana öncelik ver. */
    flex: 1 1 360px;
    min-height: 340px;
  }
  #templateBar {
    padding: 8px 10px;
    background: #eef2f9;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #dbe3ee;
  }
  #templateBar label { font-size: 14px; color: #445; }
  #templateSelect {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #ccd;
    font-size: 14px;
  }
  #runBar {
    padding: 10px;
    background: #ffffff;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #runBar button {
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }
  #runBar button:disabled {
    background: #a9d3ac;
    cursor: not-allowed;
  }
  #stageWrap {
    background: #1b2a3a;
    display: flex;
    flex-direction: column;
    /* Sahne alanı küçülebilir; blok kutusu sıkışmaz. */
    flex: 0 1 285px;
    min-height: 220px;
    overflow: hidden;
  }
  #stageCanvas {
    display: block;
    height: 190px;
    width: auto;
    max-width: calc(100% - 20px);
    margin: 6px auto;
    background: #24384e;
    border-radius: 10px;
  }
  #stageMsg {
    text-align: center;
    color: #ffd76b;
    font-size: 15px;
    font-weight: 600;
    min-height: 20px;
    padding-bottom: 8px;
  }
  #stageLog {
    color: #7fffb0;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    padding: 4px 12px 8px;
    max-height: 42px;
    overflow-y: auto;
  }
  #chatPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  #chatHeader {
    padding: 14px;
    background: #3f6fd1;
    color: white;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #apiKeyBtn {
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 7px;
    padding: 6px 9px;
    color: white;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
  }
  #showRobotBtn {
    display: none;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 7px;
    padding: 6px 9px;
    color: white;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
  }
  #showRobotBtn.visible { display: inline-block; }
  #teacherStage {
    position: relative;
    min-height: 180px;
    padding: 8px 34px 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #e9f1ff, #f8fbff);
    border-bottom: 1px solid #d7e3f4;
  }
  #teacherStage[hidden] { display: none; }
  #robotWrap {
    flex: 0 0 155px;
    height: 165px;
    border-radius: 18px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 24%, #ffffff, #c9dbf5 70%);
    box-shadow: 0 5px 14px rgba(44, 83, 135, .2);
  }
  #avenRobot { width: 100%; height: 100%; }
  #teacherStage.speaking #robotWrap { animation: avenTalk .65s ease-in-out infinite alternate; }
  @keyframes avenTalk { from { transform: translateY(0) scale(1); } to { transform: translateY(-4px) scale(1.025); } }
  #teacherBubble {
    position: relative;
    flex: 1;
    align-self: center;
    padding: 12px 14px;
    border-radius: 14px;
    color: #24344c;
    background: white;
    box-shadow: 0 3px 12px rgba(39, 72, 112, .12);
    line-height: 1.4;
    font-size: 14px;
  }
  #teacherBubble::before {
    content: '';
    position: absolute;
    left: -9px;
    top: 50%;
    width: 17px;
    height: 17px;
    background: white;
    transform: translateY(-50%) rotate(45deg);
  }
  #teacherName { display: block; color: #3f6fd1; font-weight: 700; margin-bottom: 4px; }
  #teacherSpeech { position: relative; margin: 0; }
  #hideRobotBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    padding: 0;
    border: none;
    border-radius: 50%;
    color: #52657e;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
  }
  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .msg.user { text-align: right; color: #1a4fbf; }
  .msg.ai { text-align: left; color: #1a7a3c; }
  #chatInputBar {
    display: flex;
    padding: 10px;
    gap: 8px;
    border-top: 1px solid #eee;
  }
  #chatInput {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  #chatInputBar button {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #3f6fd1;
    color: white;
    cursor: pointer;
    font-size: 15px;
  }
  #micBtn {
    background: #e0546a !important;
  }
  #micBtn.listening {
    background: #ff2244 !important;
  }
  #apiKeyDialog {
    border: none;
    border-radius: 12px;
    width: min(420px, calc(100vw - 36px));
    padding: 0;
    box-shadow: 0 12px 36px rgba(0,0,0,.28);
  }
  #apiKeyDialog::backdrop { background: rgba(19, 37, 61, .45); }
  .dialogContent { padding: 22px; }
  .dialogContent h2 { margin: 0 0 8px; font-size: 20px; color: #23344b; }
  .dialogContent p { color: #566579; line-height: 1.45; margin: 0 0 14px; }
  #apiKeyInput { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #b8c5d4; border-radius: 7px; font-size: 14px; }
  #apiKeyStatus { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: #b22d3a; }
  .dialogActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dialogActions button { border: none; border-radius: 7px; padding: 9px 13px; cursor: pointer; font-size: 14px; }
  #saveApiKeyBtn { background: #3f6fd1; color: white; }
</style>
</head>
<body>

  <div id="blocklyArea">
    <div id="templateBar">
      <label for="templateSelect">🗺️ Şablon:</label>
      <select id="templateSelect"></select>
    </div>
    <div id="blocklyDiv"></div>
    <div id="runBar">
      <button id="runBtn">▶ Çalıştır</button>
      <span id="runHint">Blokları sürükleyip bırak, sonra Çalıştır'a bas!</span>
    </div>
    <div id="stageWrap">
      <canvas id="stageCanvas" width="480" height="360"></canvas>
      <div id="stageMsg"></div>
      <div id="stageLog"></div>
    </div>
  </div>

  <div id="chatPanel">
    <div id="chatHeader"><span>🧑‍🏫 Öğretmen AI</span><span><button id="showRobotBtn" type="button">🤖 Aven’i Göster</button><button id="apiKeyBtn" type="button">⚙ API Anahtarı</button></span></div>
    <section id="teacherStage" aria-label="Aven öğretmen">
      <button id="hideRobotBtn" type="button" title="Aven’i gizle" aria-label="Aven’i gizle">×</button>
      <div id="robotWrap"><model-viewer id="avenRobot" src="../assets/aven-robot.glb" alt="Aven öğretmen robotu" camera-controls shadow-intensity="1" interaction-prompt="none"></model-viewer></div>
      <div id="teacherBubble"><span id="teacherName">Aven</span><p id="teacherSpeech">Merhaba! Birlikte kodlamayı öğrenelim.</p></div>
    </section>
    <div id="chatLog"></div>
    <div id="chatInputBar">
      <button id="micBtn" title="Aven ile sesli konuşmayı başlat">🎤 Konuş</button>
      <input id="chatInput" type="text" placeholder="Bir şey sor..." />
      <button id="sendBtn">Gönder</button>
    </div>
  </div>

  <dialog id="apiKeyDialog" aria-labelledby="apiKeyTitle">
    <form class="dialogContent" id="apiKeyForm">
      <h2 id="apiKeyTitle">Groq API Anahtarı</h2>
      <p>Anahtar sadece bu bilgisayardaki <code>.env</code> dosyasına kaydedilir. Anahtarını kimseyle paylaşma.</p>
      <label for="apiKeyInput">API anahtarı</label>
      <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_..." required />
      <div id="apiKeyStatus" role="status"></div>
      <div class="dialogActions">
        <button id="cancelApiKeyBtn" type="button">Vazgeç</button>
        <button id="saveApiKeyBtn" type="submit">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- Blockly (CDN uzerinden - internet gerektirir; offline kullanim icin
       Blockly dosyalarini indirip yerel /vendor klasorune koyup buradaki
       src'leri yerel yola cevirebilirsin) -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
