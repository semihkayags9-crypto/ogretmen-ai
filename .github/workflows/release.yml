name: Windows kurulum dosyası üret

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --x64 --publish never
      - name: exe'yi GitHub release'e yükle
        run: gh release upload v0.4.0 "dist/Ogretmen AI Setup 0.4.0.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
